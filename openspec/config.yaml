schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  proposal:
    - Assess whether a version bump (major, minor, or patch) is required according to Semantic Versioning and explicitly state the target version and rationale in the proposal.
  tasks:
    - Include a specific task to update CHANGELOG.md and bump the version in package.json when a version bump is required.
    - Include a specific task to run `npm run build`.

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
operations:
  apply:
    guidance:
      - Keep test summaries concise.
      - Update CHANGELOG.md with implemented changes.
  archive:
    guidance:
      - Verify that CHANGELOG.md has an entry documenting the change under the corresponding version and date before finishing.
      - Ensure package.json version reflects the assessed version bump.
